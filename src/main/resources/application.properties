spring.application.name=HealthConnect

# --- Seeded dev login users (created by SecurityDataInitializer on an empty DB) ---
# admin   / Admin@123    (ADMIN   - full access)
# doctor  / Doctor@123   (DOCTOR  - doctor portal)
# patient / Patient@123  (CUSTOMER - customer portal)
# jwt.secret / jwt.expiry-minutes can be overridden here for production.

# --- Report uploads (admin uploads patient report PDFs; stored locally) ---
app.reports.dir=uploads/reports
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/healthconnect
spring.datasource.username=root
spring.datasource.password=root


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Required: long-lived SSE chat streams must NOT pin a DB connection, or the pool exhausts and the whole app stalls.
spring.jpa.open-in-view=false

#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true